<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Hortifruti</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }

        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f1f6ee; margin: 0; }

        .container { display: flex; flex-direction: row; align-items: center; gap: 20px; background-color: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }

        .painel-esquerdo select { width: 150px; height: 200px; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }

        .painel-meio { display: flex; flex-direction: column; gap: 10px; }
        .painel-meio button { padding: 12px 20px; font-size: 15px; font-weight: bold; color: #fff; border: none; border-radius: 4px; cursor: pointer; transition: background-color 0.2s; }
        #btnDetalhes { background-color: #2e7d32; }
        #btnDetalhes:hover { background-color: #1b5e20; }
        #btnAbrirModal { background-color: #f57c00; }
        #btnAbrirModal:hover { background-color: #e65100; }

        .painel-direito { display: flex; flex-direction: column; gap: 10px; width: 250px; }
        .card-info { border: 1px solid #ddd; border-radius: 4px; padding: 10px; background-color: #fafafa; }
        .card-info strong { display: block; color: #555; font-size: 12px; text-transform: uppercase; margin-bottom: 5px; }
        .card-info div { font-size: 15px; color: #333; }
        #divImagem { font-size: 40px; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); justify-content: center; align-items: center; }
        .modal-content { background-color: #fff; padding: 25px; border-radius: 8px; width: 320px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); }
        .modal-content h3 { margin-top: 0; margin-bottom: 15px; color: #333; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 4px; color: #666; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .modal-acoes { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
        .modal-acoes button { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-salvar { background-color: #28a745; color: white; }
        .btn-cancelar { background-color: #dc3545; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Esquerda: Listbox (preenchida pelo JavaScript a partir do array de objetos) -->
        <div class="painel-esquerdo">
            <select id="selectProdutos" size="5"></select>
        </div>

        <!-- Meio: Botões -->
        <div class="painel-meio">
            <button id="btnDetalhes">Detalhes</button>
            <button id="btnAbrirModal">Novo Produto</button>
        </div>

        <!-- Direita: Quadros de informações -->
        <div class="painel-direito">
            <div class="card-info"><strong>Categoria</strong><div id="divCategoria">-</div></div>
            <div class="card-info"><strong>Preço</strong><div id="divPreco">-</div></div>
            <div class="card-info"><strong>Estoque</strong><div id="divEstoque">-</div></div>
            <div class="card-info"><strong>Imagem</strong><div id="divImagem">-</div></div>
        </div>
    </div>

    <!-- Modal de cadastro -->
    <div class="modal-overlay" id="modalForm">
        <div class="modal-content">
            <h3>Cadastrar Novo Produto</h3>
            <div class="form-group">
                <label for="inputNome">Nome do Produto:</label>
                <input type="text" id="inputNome" placeholder="Ex: Laranja">
            </div>
            <div class="form-group">
                <label for="inputCategoria">Categoria:</label>
                <select id="inputCategoria">
                    <option>Fruta</option>
                    <option>Legume</option>
                    <option>Verdura</option>
                </select>
            </div>
            <div class="form-group">
                <label for="inputPreco">Preço por kg (R$):</label>
                <input type="number" id="inputPreco" placeholder="Ex: 4.50" step="0.01" min="0">
            </div>
            <div class="form-group">
                <label for="inputEstoque">Estoque (kg):</label>
                <input type="number" id="inputEstoque" placeholder="Ex: 30" min="0">
            </div>
            <div class="form-group">
                <label for="inputEmoji">Emoji (imagem):</label>
                <input type="text" id="inputEmoji" placeholder="Ex: 🍊" maxlength="2">
            </div>
            <div class="modal-acoes">
                <button type="button" class="btn-cancelar" id="btnCancelar">Cancelar</button>
                <button type="button" class="btn-salvar" id="btnSalvar">Salvar</button>
            </div>
        </div>
    </div>

    <script>
        // Definição da Classe Produto (molde para criar os objetos)
        class Produto {
            constructor(nome, categoria, preco, estoque, emoji) {
                this.nome = nome;
                this.categoria = categoria;
                this.preco = preco;
                this.estoque = estoque;
                this.emoji = emoji;
            }
        }

        // Único array contendo objetos (instâncias) da classe Produto, em memória RAM
        const listaProdutos = [
            new Produto("Banana",  "Fruta",   6.90, 40, "🍌"),
            new Produto("Maçã",    "Fruta",   9.50, 30, "🍎"),
            new Produto("Tomate",  "Legume",  7.80, 25, "🍅"),
            new Produto("Cenoura", "Legume",  5.40, 35, "🥕"),
            new Produto("Alface",  "Verdura", 3.50, 20, "🥬")
        ];

        // Mapeamento dos elementos da DOM
        const selectProdutos = document.getElementById("selectProdutos");
        const btnDetalhes    = document.getElementById("btnDetalhes");
        const btnAbrirModal  = document.getElementById("btnAbrirModal");
        const btnCancelar    = document.getElementById("btnCancelar");
        const btnSalvar      = document.getElementById("btnSalvar");
        const modalForm      = document.getElementById("modalForm");

        const divCategoria = document.getElementById("divCategoria");
        const divPreco     = document.getElementById("divPreco");
        const divEstoque   = document.getElementById("divEstoque");
        const divImagem    = document.getElementById("divImagem");

        // Preenche a listbox percorrendo o array de objetos
        function atualizarSelect() {
            selectProdutos.innerHTML = "";
            for (let i = 0; i < listaProdutos.length; i++) {
                selectProdutos.innerHTML += `<option value="${i}">${listaProdutos[i].nome}</option>`;
            }
        }

        // Botão "Detalhes": acessa os atributos com objeto.atributo
        btnDetalhes.addEventListener("click", function() {
            const index = selectProdutos.value;

            if (index !== "") {
                const produto = listaProdutos[index];
                divCategoria.textContent = produto.categoria;
                divPreco.textContent = `R$ ${produto.preco.toFixed(2)} / kg`;
                divEstoque.textContent = `${produto.estoque} kg`;
                divImagem.textContent = produto.emoji;
            }
        });

        // Abrir / fechar modal
        btnAbrirModal.addEventListener("click", function() {
            modalForm.style.display = "flex";
        });

        btnCancelar.addEventListener("click", function() {
            modalForm.style.display = "none";
            limparFormulario();
        });

        // Salvar novo produto: cria UM objeto e dá push no array
        btnSalvar.addEventListener("click", function() {
            const nome = document.getElementById("inputNome").value.trim();
            const categoria = document.getElementById("inputCategoria").value;
            const preco = Number(document.getElementById("inputPreco").value);
            const estoque = Number(document.getElementById("inputEstoque").value);
            const emoji = document.getElementById("inputEmoji").value.trim() || "🛒";

            if (nome === "" || preco <= 0 || estoque < 0) {
                alert("Informe o nome, um preço maior que zero e um estoque válido!");
                return;
            }

            listaProdutos.push(new Produto(nome, categoria, preco, estoque, emoji));

            atualizarSelect();
            selectProdutos.value = listaProdutos.length - 1; // seleciona o novo produto

            modalForm.style.display = "none";
            limparFormulario();
        });

        function limparFormulario() {
            document.getElementById("inputNome").value = "";
            document.getElementById("inputCategoria").selectedIndex = 0;
            document.getElementById("inputPreco").value = "";
            document.getElementById("inputEstoque").value = "";
            document.getElementById("inputEmoji").value = "";
        }

        // Início: monta a listbox e seleciona o primeiro produto
        atualizarSelect();
        selectProdutos.selectedIndex = 0;
    </script>

</body>
</html>

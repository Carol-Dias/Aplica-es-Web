<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>3.3 Lista de Tarefas</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; flex-direction: column; align-items: center; margin-top: 80px; }
    input { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 10px 20px; font-size: 16px; color: #fff; background: #28a745; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #218838; }
    ul { margin-top: 20px; font-size: 18px; }
  </style>
</head>
<body>
  <h2>Lista de Tarefas</h2>
  <div>
    <input type="text" id="campoTarefa" placeholder="Descrição da tarefa">
    <button onclick="adicionarTarefa()">Adicionar Tarefa</button>
  </div>
  <ul id="minhasTarefas"></ul>

  <script>
    let listaDeTarefas = [];

    function adicionarTarefa() {
      const campo = document.getElementById('campoTarefa');
      const texto = campo.value;

      if (texto === "") return; // ignora tarefa vazia

      listaDeTarefas.push(texto);
      campo.value = "";
      atualizarLista();
    }

    function atualizarLista() {
      const lista = document.getElementById('minhasTarefas');
      lista.innerHTML = ""; // limpa a lista antes de redesenhar

      for (let i = 0; i < listaDeTarefas.length; i++) {
        lista.innerHTML += "<li>" + listaDeTarefas[i] + "</li>";
      }
    }
  </script>
</body>
</html>

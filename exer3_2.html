<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>3.2 Calculadora de Média</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; flex-direction: column; align-items: center; margin-top: 80px; }
    input { width: 90px; padding: 10px; font-size: 16px; text-align: center; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 10px 20px; font-size: 16px; color: #fff; background: #007bff; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #0056b3; }
    #resultadoCalculo { font-size: 20px; font-weight: bold; margin-top: 20px; }
  </style>
</head>
<body>
  <h2>Calculadora de Média</h2>
  <div>
    <input type="number" id="nota1" placeholder="Nota 1" step="0.1">
    <input type="number" id="nota2" placeholder="Nota 2" step="0.1">
    <button onclick="mostrarResultado()">Calcular Média</button>
  </div>
  <p id="resultadoCalculo"></p>

  <script>
    // Recebe duas notas e retorna a média aritmética
    function calcularMedia(n1, n2) {
      return (n1 + n2) / 2;
    }

    function mostrarResultado() {
      const campo1 = document.getElementById('nota1').value;
      const campo2 = document.getElementById('nota2').value;
      const saida = document.getElementById('resultadoCalculo');

      // Validação: campos vazios não podem ser calculados
      if (campo1 === "" || campo2 === "") {
        saida.innerText = "Preencha as duas notas.";
        saida.style.color = "black";
        return;
      }

      const media = calcularMedia(Number(campo1), Number(campo2));

      if (media >= 7.0) {
        saida.innerText = "Média: " + media.toFixed(1) + " - Aprovado";
        saida.style.color = "green";
      } else {
        saida.innerText = "Média: " + media.toFixed(1) + " - Recuperação";
        saida.style.color = "red";
      }
    }
  </script>
</body>
</html>
